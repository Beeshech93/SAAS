services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wba}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wba}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wba}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    # Not published: only the frontend (and, in production, your reverse proxy) should reach the API.
    # Uncomment to debug locally. Never expose it directly with TRUST_PROXY=1 (X-Forwarded-For could be spoofed).
    # ports:
    #   - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://backend:4000
    restart: unless-stopped
    environment:
      API_URL: http://backend:4000
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # Prepared for later phases (queues, rate-limit store, cache):
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped

volumes:
  pgdata:
