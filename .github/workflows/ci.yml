name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wba
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wba" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://wba:ci-only-password@localhost:5432/wba?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run prisma:generate -w apps/api
      - run: npm run typecheck -w apps/api
      - run: npm run typecheck -w apps/web
      - run: npm test                                   # fast suite, no database needed
      - run: npm run prisma:deploy -w apps/api          # real migrations
      - run: npm run test:integration -w apps/api       # real PostgreSQL
      - run: npm run build
        env: { API_URL: "http://localhost:4000" }
      - run: npm audit --omit=dev --audit-level=high
